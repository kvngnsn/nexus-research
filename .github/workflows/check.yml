name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make dev
      - run: make check
